<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAPHY HOMEWORK HELPER 📚 FIXED!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f0f1a;color:white;padding:16px;padding-bottom:40px}
header{background:linear-gradient(135deg,#6c5ce7,#ff0055);padding:14px;border-radius:16px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px}
.card{background:#1e1e2f;border-radius:18px;padding:16px;margin-top:14px;border:1px solid #333}
.card h3{margin-bottom:8px}
.card p{font-size:13px;color:#bbb;line-height:1.5}
input{width:100%;padding:14px;border-radius:14px;border:2px solid #6c5ce7;background:#111;color:white;outline:none;font-size:15px;margin:10px 0}
button{width:100%;padding:14px;border:none;border-radius:14px;font-weight:bold;cursor:pointer;font-size:15px}
.answer{background:#111;border:2px solid #ffcc00;border-radius:14px;padding:14px;margin-top:12px;font-size:15px;line-height:1.7;display:none}
.answer.show{display:block}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.quick button{width:auto;padding:8px 12px;background:#333;color:white;font-size:12px}
.calc-row{display:flex;gap:8px}
.calc-row input{flex:1}
.opt{background:#111;border:1px solid #333;padding:11px;border-radius:12px;margin:7px 0;cursor:pointer}
.opt.correct{background:#00a651!important;color:white}
.opt.wrong{background:#ff0055!important;color:white}
</style>
</head>
<body>

<header><b>📚 TAPHY HELPER 🔥</b><b style="color:#ffcc00">⭐ 1,250</b></header>

<div style="text-align:center;padding:18px 0">
<h1 style="font-size:30px">Homework?<br><span style="color:#ffcc00">SOLVED! 🔥</span></h1>
<p style="color:#bbb;margin-top:6px;font-size:13px">Andika swali hapa chini → Bonyeza ASK → Jibu linatokea!</p>
</div>

<div class="card" style="border:2px solid #6c5ce7">
<h3>🤖 ASK TAPHY AI — Jaribu Sasa!</h3>
<p>Andika swali lolote hapa:</p>
<input type="text" id="question" placeholder="e.g. 12 x 8 = ?  au  5 + 5  au  What is photosynthesis?">
<button style="background:#ffcc00;color:#111" onclick="askAI()">🤖 ASK AI → SHOW ANSWER</button>
<div style="text-align:center;font-size:12px;color:#888;margin-top:8px" id="loading" style="display:none"></div>
<div class="answer" id="aiAnswer"></div>

<div class="quick">
<button onclick="testQ('12 x 8')">12 x 8 = ?</button>
<button onclick="testQ('20 + 15')">20 + 15</button>
<button onclick="testQ('100 / 4')">100 / 4</button>
<button onclick="testQ('What is photosynthesis?')">Photosynthesis?</button>
<button onclick="testQ('Past tense of go')">Past tense of go?</button>
<button onclick="testQ('Capital of Kenya')">Capital of Kenya?</button>
</div>
</div>

<div class="card">
<h3>🧮 Calculator — Haraka!</h3>
<div class="calc-row">
<input type="number" id="n1" placeholder="Namba 1">
<input type="number" id="n2" placeholder="Namba 2">
</div>
<div style="display:flex;gap:8px">
<button style="background:#6c5ce7;color:white" onclick="calc('+')">+</button>
<button style="background:#ff0055;color:white" onclick="calc('-')">-</button>
<button style="background:#00a651;color:white" onclick="calc('*')">×</button>
<button style="background:#ffcc00;color:#111" onclick="calc('/')">÷</button>
</div>
<p id="calcResult" style="font-size:20px;font-weight:bold;text-align:center;margin-top:10px;color:#ffcc00"></p>
</div>

<div class="card">
<h3>🧠 QUICK QUIZ</h3>
<p id="quizQ"><b>Q: 12 x 8 = ?</b></p>
<div id="quizOpts">
<div class="opt" onclick="check(this,false)">A) 86</div>
<div class="opt" onclick="check(this,true)">B) 96</div>
<div class="opt" onclick="check(this,false)">C) 108</div>
</div>
<p id="quizResult" style="color:#00ff00;font-weight:bold;margin-top:8px"></p>
<button style="background:#ffcc00;margin-top:8px" onclick="nextQuiz()">Next Question →</button>
</div>

<div style="text-align:center;color:#888;font-size:12px;margin-top:14px">Made by Taphy Samson • Homabay 🇰🇪 • FIXED VERSION ✅</div>

<script>
function askAI(){
  let q = document.getElementById('question').value.trim();
  let ansBox = document.getElementById('aiAnswer');
  let loading = document.getElementById('loading');
  if(!q){
    alert('✍️ Andika swali kwanza! Mfano: 12 x 8');
    document.getElementById('question').focus();
    return;
  }
  // SHOW LOADING
  ansBox.classList.add('show');
  ansBox.innerHTML = '🤖 <b>Taphy AI inafikiria...</b><br>⏳ Tafadhali subiri 1 sec...';
  loading.innerText = '';
  // CALCULATE AFTER 800ms
  setTimeout(function(){
    let lower = q.toLowerCase();
    let answer = '';
    // 1. MATHS - Try to calculate any math like 12x8, 12*8, 12 + 5
    let mathText = q.replace(/x/g,'*').replace(/×/g,'*').replace(/÷/g,'/').replace(/=/g,'').replace(/\?/g,'');
    try {
      if(/^[0-9\s\+\-\*\/\.\(\)]+$/.test(mathText.trim()) && mathText.trim().length>0){
        let result = eval(mathText);
        answer = '✅ <b>ANSWER: '+result+'</b><br><br><b>Swali lako:</b> '+q+'<br><b>Steps:</b><br>1. Andika: '+q+'<br>2. Hesabu: '+mathText+'<br>3. Jibu = <b>'+result+'</b><br><br>🎉 +10 Points! Easy! 🔥';
        ansBox.innerHTML = answer;
        ansBox.scrollIntoView({behavior:'smooth'});
        return;
      }
    } catch(e){}
    // 2. KNOWN QUESTIONS
    if(lower.includes('photosynthesis')) answer = '🌱 <b>Photosynthesis = Mimea inatengeneza chakula</b><br><br>☀️ Sunlight + 💧 Water + 🌬️ CO2 = Glucose + Oxygen<br><br>Formula: 6CO2 + 6H2O → C6H12O6 + 6O2<br><br>🎉 +10 Points!';
    else if(lower.includes('past') && lower.includes('go')) answer = '✅ <b>Past tense of GO = WENT</b><br>Example: I <b>went</b> to school yesterday.<br>Past Participle = Gone.<br><br>🎉 +10 Points!';
    else if(lower.includes('capital') && lower.includes('kenya')) answer = '🇰🇪 <b>Capital of Kenya = NAIROBI ✅</b><br>Nairobi ni capital city. Mombasa ni second city.<br><br>🎉 +10 Points!';
    else if(lower.includes('mofolojia')) answer = '🗣️ <b>Mofolojia = Sarufi ya muundo wa maneno</b><br>Mfano: Mwalimu = M- + walimu<br><br>🎉 +10 Points!';
    else if(lower.includes('water') && lower.includes('formula')) answer = '💧 <b>Water Formula = H2O ✅</b><br>H = Hydrogen, O = Oxygen.<br><br>🎉 +10 Points!';
    else {
      // 3. GENERAL ANSWER - FOR ANY QUESTION!
      answer = '🤖 <b>Swali lako:</b> "'+q+'"<br><br><b>✅ JIBU:</b><br>Swali nzuri sana! Hapa ni jinsi ya kujibu:<br><br>1. Soma swali vizuri<br>2. Andika unachojua<br>3. Kama ni Maths, tumia formula<br>4. Kama ni English, angalia grammar<br>5. Check jibu lako mara mbili<br><br>💡 <b>Tip:</b> Jaribu kuandika swali la Maths kama "12 x 8" au "20 + 15" — Nitahesabu mara moja!<br><br>🎉 +10 Points! Uko smart! 🔥';
    }
    ansBox.innerHTML = answer;
    ansBox.scrollIntoView({behavior:'smooth'});
  }, 800);
}
function testQ(q){ document.getElementById('question').value = q; askAI(); }
function calc(op){
  let a = parseFloat(document.getElementById('n1').value);
  let b = parseFloat(document.getElementById('n2').value);
  if(isNaN(a) || isNaN(b)){ document.getElementById('calcResult').innerText = 'Weka namba mbili kwanza!'; return; }
  let r = op=='+'?a+b : op=='-'?a-b : op=='*'?a*b : a/b;
  document.getElementById('calcResult').innerText = a+' '+op+' '+b+' = '+r+' ✅';
}
let quizzes = [
  {q:'12 x 8 = ?', opts:['86','96','108'], correct:1},
  {q:'Capital of Kenya?', opts:['Mombasa','Nairobi','Kisumu'], correct:1},
  {q:'5 + 7 x 2 = ?', opts:['24','19','12'], correct:1},
];
let qi=0;
function check(el,ok){
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('correct','wrong'));
  if(ok){ el.classList.add('correct'); document.getElementById('quizResult').innerText='🎉 CORRECT! +20 Points!'; }
  else{ el.classList.add('wrong'); document.getElementById('quizResult').innerText='❌ Oops! Jaribu tena!'; }
}
function nextQuiz(){
  qi=(qi+1)%quizzes.length;
  let q=quizzes[qi];
  document.getElementById('quizQ').innerHTML='<b>Q: '+q.q+'</b>';
  let opts=document.getElementById('quizOpts');
  opts.innerHTML='';
  q.opts.forEach((o,i)=>{
    let d=document.createElement('div');
    d.className='opt';
    d.innerText=String.fromCharCode(65+i)+') '+o;
    d.onclick=()=>check(d,i==q.correct);
    opts.appendChild(d);
  });
  document.getElementById('quizResult').innerText='';
}
// Enter key works too!
document.getElementById('question').addEventListener('keypress', function(e){ if(e.key==='Enter') askAI(); });
</script>
</body>
</html>
